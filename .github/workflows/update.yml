name: Update macro data

on:
  push:
    branches: [main]
    paths:
      - fetch_data.py
      - requirements.txt
      - .github/workflows/update.yml
  schedule:
    # 00:47 UTC is after the UTC daily boundary, so the previous US close is
    # included instead of being excluded as an unfinished current-day candle.
    - cron: '47 0 * * *'
    # Refresh official rates and funding-market releases later in the day.
    - cron: '17 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch daily snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional reviewed public SR3-settlement export. When absent, the
          # page deliberately marks the P block and total score 待核验.
          CME_SR3_FORWARD_URL: ${{ secrets.CME_SR3_FORWARD_URL }}
        run: python -u fetch_data.py
      - name: Commit changed snapshot and push default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: refresh daily macro snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          echo "Push failed after three attempts."
          exit 1
