name: Update weekly economic calendar

on:
  schedule:
    # Europe/Berlin Sunday 00:00 is Saturday 22:00 UTC in summer and
    # Saturday 23:00 UTC in winter. The script validates local time.
    - cron: '0 22,23 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-economic-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch the new week
        run: python -u fetch_economic_calendar.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Commit changed calendar and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- economic_calendar.json
          if git diff --cached --quiet; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: refresh weekly economic calendar"
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
