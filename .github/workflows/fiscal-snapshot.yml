name: Update fiscal fallback snapshot

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_fiscal_snapshot.py
      - .github/workflows/fiscal-snapshot.yml

permissions:
  contents: write

concurrency:
  group: fiscal-fallback-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -u fetch_fiscal_snapshot.py
      - name: Publish verified snapshot
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- fiscal_snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: refresh fiscal fallback snapshot"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
